# ─────────────────────────────────────────────
#  EconomyLogger  ·  gui.yml
#  Every color, name, lore line, material and slot is here.
#  Text uses MiniMessage. Theme tags you can use anywhere:
#    <g>..</g>  main gradient     <g2>..</g2>  accent gradient
#    <in> income   <out> spending   <muted> soft grey-green   <text> light text
# ─────────────────────────────────────────────

theme:
  gradient: ["#B6FFCF", "#3DDC84", "#0FA958"]
  accent: ["#E3FF8A", "#7BE495"]
  income: "#5BE49B"
  spend: "#FF7A7A"
  muted: "#8BA698"
  text: "#EAFBF1"

sounds:
  enabled: true
  open: "block.amethyst_block.chime"
  click: "ui.button.click"
  page: "item.book.page_turn"
  volume: 0.6
  pitch: 1.4

log-menu:
  title: "<g><b>Economy Log</b></g> <dark_gray>· <text>{player}"
  rows: 6
  # Inventory slots used for entries, in order.
  entry-slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34,37,38,39,40,41,42,43]
  border:
    enabled: true
    # Alternating panes give the border a soft gradient look.
    materials: [LIME_STAINED_GLASS_PANE, GREEN_STAINED_GLASS_PANE]
  summary:
    slot: 4
    name: "<g><b>{player}</b></g>"
    lore:
      - "<muted>Period · <text>{period}"
      - ""
      - "<in>▲ Received  <text>{income}"
      - "<out>▼ Spent     <text>{spent}"
      - "<g2>◆ Net       </g2><text>{net}"
      - ""
      - "<muted>{count} transactions"
      - "<muted>Balance now · <text>{balance}"
  buttons:
    previous: { slot: 45, material: SPECTRAL_ARROW, name: "<g>← Previous page</g>", lore: ["<muted>Page {page} of {pages}"] }
    next:     { slot: 53, material: SPECTRAL_ARROW, name: "<g>Next page →</g>",     lore: ["<muted>Page {page} of {pages}"] }
    type:
      slot: 47
      material: HOPPER
      name: "<g><b>Filter</b></g>"
      lore: ["{options}", "", "<muted>Click to change"]
    plugin:
      slot: 48
      material: COMPARATOR
      name: "<g><b>Source plugin</b></g>"
      lore: ["<muted>Showing · <text>{value}", "", "<muted>Left click · next", "<muted>Right click · reset"]
    close:    { slot: 49, material: BARRIER, name: "<out><b>Close</b>", lore: [] }
    period:
      slot: 50
      material: CLOCK
      name: "<g><b>Period</b></g>"
      lore: ["{options}", "", "<muted>Click to change"]
    sources:
      slot: 51
      material: KNOWLEDGE_BOOK
      name: "<g><b>Where money comes from</b></g>"
      lore: ["<muted>Totals per plugin and", "<muted>the players you trade with most.", "", "<muted>Click to open"]
  option-selected: "<g2>» {option}</g2>"
  option-other: "<muted>  {option}"
  empty:
    slot: 22
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "<muted>Nothing here yet"
    lore: ["<muted>Try another filter or period."]

entry:
  name-income: "<in><b>+ {amount}</b>"
  name-spend: "<out><b>- {amount}</b>"
  # A line is hidden automatically when one of its {placeholders} is empty.
  lore:
    - "<muted>Source   <text>{plugin}"
    - "<muted>From     <text>{from}"
    - "<muted>To       <text>{to}"
    - "<muted>Via      <text>{context}"
    - "<muted>World    <text>{world}"
    - "<muted>When     <text>{ago} <dark_gray>{date}"
    - "<muted>Balance  <text>{balance}"
  items-header: ["", "<g><b>Items with this payment</b></g>"]
  item-received: " <in>+ {amount}x <text>{item}"
  item-removed: " <out>- {amount}x <text>{item}"
  items-more: " <muted>... and {more} more"
  items-preview: 4
  items-footer: ["", "<g2>Click to inspect the items</g2>"]
  # Icons. Order: received item > player head (payments) > plugin icon > default.
  show-received-item: true
  transfer-uses-head: true
  income-material: EMERALD
  spend-material: REDSTONE
  plugin-icons:
    Essentials: GOLD_INGOT

items-menu:
  title: "<g><b>Items</b></g> <dark_gray>· <text>{amount}"
  rows: 6
  received-lore: ["", "<in>▲ Received <text>{amount}x"]
  removed-lore: ["", "<out>▼ Removed <text>{amount}x"]
  back: { slot: 49, material: SPECTRAL_ARROW, name: "<g>← Back</g>", lore: [] }

sources-menu:
  title: "<g><b>Money sources</b></g> <dark_gray>· <text>{player}"
  rows: 6
  plugins-header: { slot: 1, material: COMPARATOR, name: "<g><b>By plugin</b></g>", lore: ["<muted>{period}"] }
  plugin-slots: [10,11,12,19,20,21,28,29,30,37,38,39]
  plugin-name: "<g><b>{plugin}</b></g>"
  plugin-lore:
    - "<in>▲ Received <text>{income} <muted>({in_count})"
    - "<out>▼ Spent    <text>{spent} <muted>({out_count})"
    - "<g2>◆ Net      </g2><text>{net}"
    - ""
    - "<muted>Click to filter the log"
  plugin-material: PAPER
  partners-header: { slot: 7, material: PLAYER_HEAD, name: "<g><b>Top partners</b></g>", lore: ["<muted>Players who paid or got paid"] }
  partner-slots: [14,15,16,23,24,25,32,33,34,41,42,43]
  partner-name: "<g><b>{player}</b></g>"
  partner-lore:
    - "<in>▲ From them <text>{income}"
    - "<out>▼ To them   <text>{spent}"
    - "<g2>◆ Net       </g2><text>{net}"
  back: { slot: 49, material: SPECTRAL_ARROW, name: "<g>← Back</g>", lore: [] }

labels:
  types: { ALL: "Everything", INCOME: "Money in", SPEND: "Money out", PAYMENTS: "Player payments", ITEMS: "With items" }
  periods: { DAY: "Last 24 hours", WEEK: "Last 7 days", MONTH: "Last 30 days", ALL: "All time" }
  all-plugins: "All plugins"
  unknown: "Unknown"
  ago: { now: "just now", seconds: "{n}s ago", minutes: "{n}m ago", hours: "{n}h ago", days: "{n}d ago" }
