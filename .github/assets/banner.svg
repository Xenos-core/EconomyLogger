<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06140C"/>
      <stop offset="1" stop-color="#0B2416"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B6FFCF"/>
      <stop offset="0.5" stop-color="#3DDC84"/>
      <stop offset="1" stop-color="#0FA958"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3DDC84" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3DDC84"/>
      <stop offset="1" stop-color="#3DDC84" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#3DDC84" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="900" height="220" rx="18" fill="url(#bg)"/>
  <rect width="900" height="220" rx="18" fill="url(#grid)"/>
  <g transform="translate(450 92)" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text font-size="64" font-weight="800" fill="url(#title)" letter-spacing="1">EconomyLogger</text>
    <rect x="-220" y="22" width="440" height="2" fill="url(#line)"/>
    <text y="62" font-size="20" fill="#7BE495">Every payment. Every source. Every item.</text>
  </g>
  <g font-family="Consolas, Menlo, monospace" font-size="15" fill="#3DDC84" fill-opacity="0.35">
    <text x="36" y="44">+$250.00</text>
    <text x="790" y="44">-$100.00</text>
    <text x="36" y="196">+16x Diamond</text>
    <text x="726" y="196">via AuctionHouse</text>
  </g>
</svg>
