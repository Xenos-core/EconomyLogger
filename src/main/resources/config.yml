# ─────────────────────────────────────────────
#  EconomyLogger  ·  config.yml
#  Watches every Vault economy call and records
#  who got money, from where, and what came with it.
# ─────────────────────────────────────────────

hook:
  # Put a transparent recorder in front of your economy plugin (Essentials, CMI, etc).
  # Every plugin that asks Vault for the economy talks through it, so nothing is missed.
  enabled: true
  # Also log calls that failed (not enough money, account missing...).
  log-failed: false

tracking:
  # Transactions smaller than this are ignored (0 = log everything).
  min-amount: 0.0
  # Plugin names whose money calls are never logged (case-insensitive).
  ignored-plugins: []
  # Player names that are never logged (e.g. bank / NPC accounts).
  ignored-players: []
  # How a payment between two players is detected: a withdraw from player Y followed by
  # a deposit to player X, by the same plugin, on the same thread, within this window.
  pairing:
    enabled: true
    window-ms: 100
    # smaller / larger amount must be at least this ratio (allows auction tax, fees).
    min-ratio: 0.5
  # Remember what the player was doing right before the payment.
  context:
    commands: true        # "/ah sell 500"
    menus: true           # "menu: Auction House"
    console: true         # "console: /eco give Steve 100"
    window-ms: 100
    max-length: 64

items:
  # Snapshot the inventory when money moves and diff it a moment later,
  # so you see "-$500 → +16x Diamond" for auction house / shop purchases.
  enabled: true
  delay-ticks: 2
  # Do not track items for these plugins (e.g. jobs plugins that pay every block).
  ignored-plugins: []
  # Max distinct item stacks saved per transaction.
  max-per-transaction: 27

essentials:
  # Log Essentials' own /pay, /eco and /sell (they do not go through Vault).
  enabled: true
  causes: [COMMAND_PAY, COMMAND_ECO, COMMAND_SELL, SPECIAL, UNKNOWN, API]

storage:
  file: transactions.db
  # Writes happen on a separate thread in batches, never on a server tick.
  batch-size: 500
  flush-interval-ms: 1000
  # Hard cap for pending writes kept in memory (protects RAM if the disk stalls).
  queue-limit: 200000
  # Delete records older than this many days (0 = keep forever).
  retention-days: 90

format:
  currency-prefix: "$"
  currency-suffix: ""
  decimals: 2
  # Use your economy plugin's own format() instead of the settings above.
  use-economy-format: false
  date: "yyyy-MM-dd HH:mm"
  # Empty = server time zone. Example: "Asia/Tehran"
  timezone: ""
